<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT-2 Throwback — One-Word Story (Gemini Interactions API)</title>
  <style>
    body { max-width: 720px; margin: 24px auto; padding: 0 12px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, textarea { width: 100%; box-sizing: border-box; margin-top: 4px; }
    button { margin-top: 12px; }
    pre { white-space: pre-wrap; word-break: break-word; border: 1px solid #ccc; padding: 10px; }
    #output { white-space: pre-wrap; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>One-Word Story (GPT-2 Throwback)</h1>
  <p>Enter one word. Gemini continues it into a short story using a single-turn Interactions API call.</p>

  <form id="requestForm">
    <fieldset>
      <legend>Request</legend>

      <label for="apiKey">API Key (x-goog-api-key)</label>
      <input id="apiKey" type="password" placeholder="Paste your Gemini API key" autocomplete="off" />

      <label for="word">Word (input)</label>
      <input id="word" type="text" value="Unicorn" placeholder="Enter one word" autocomplete="off" />

      <label for="system">System instructions (system_instruction)</label>
      <textarea id="system" rows="3">You are a GPT-2 style text-completion storyteller. The user provides a single word. Continue directly from that exact word as the first word of a vivid short story (120 to 180 words). No title, no intro, no quotes.</textarea>

      <button id="submitBtn" type="submit">Generate Story</button>
      <span id="status"></span>
    </fieldset>
  </form>

  <h2>Story</h2>
  <p id="output">(Your generated story will appear here.)</p>

  <h2>Explicit Request Code</h2>
  <pre id="codeView"></pre>

  <script>
    const form = document.getElementById("requestForm");
    const apiKeyInput = document.getElementById("apiKey");
    const wordInput = document.getElementById("word");
    const systemInput = document.getElementById("system");
    const submitBtn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");
    const codeView = document.getElementById("codeView");

    function getOneWord() {
      return wordInput.value.trim().split(/\s+/)[0] || "";
    }

    function extractText(data) {
      if (typeof data.output_text === "string" && data.output_text.trim()) {
        return data.output_text.trim();
      }
      if (Array.isArray(data.steps)) {
        const modelSteps = data.steps.filter((s) => s && s.type === "model_output");
        const parts = [];
        for (const step of modelSteps) {
          if (typeof step.text === "string") parts.push(step.text);
          if (Array.isArray(step.content)) {
            for (const c of step.content) {
              if (c && c.type === "text" && typeof c.text === "string") parts.push(c.text);
            }
          }
        }
        if (parts.length) return parts.join("").trim();
      }
      if (Array.isArray(data.outputs)) {
        return data.outputs.map((o) => o?.text || "").join("").trim();
      }
      return "";
    }

    function renderRequestCode() {
      const keyDisplay = apiKeyInput.value.trim() ? "YOUR_API_KEY (entered above)" : "YOUR_API_KEY";
      const word = getOneWord() || "Unicorn";
      const system = systemInput.value.trim();

      codeView.textContent =
`const response = await fetch("https://generativelanguage.googleapis.com/v1beta/interactions", {
  method: "POST",
  headers: {
    "Content-Type": "application/json",
    "x-goog-api-key": ${JSON.stringify(keyDisplay)}
  },
  body: JSON.stringify({
    model: "gemini-4-hydrogen",
    system_instruction: ${JSON.stringify(system)},
    input: ${JSON.stringify(word)}
  })
});

const data = await response.json();`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const apiKey = apiKeyInput.value.trim();
      const word = getOneWord();
      const system = systemInput.value.trim();

      if (!apiKey) {
        statusEl.textContent = " Enter an API key.";
        return;
      }
      if (!word) {
        statusEl.textContent = " Enter one word.";
        return;
      }

      wordInput.value = word;
      renderRequestCode();

      submitBtn.disabled = true;
      statusEl.textContent = " Generating...";
      outputEl.textContent = "";

      try {
        // Explicit one-turn Gemini Interactions API request
        const response = await fetch("https://generativelanguage.googleapis.com/v1beta/interactions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": apiKey
          },
          body: JSON.stringify({
            model: "gemini-4-hydrogen",
            system_instruction: system,
            input: word
          })
        });

        const data = await response.json();

        if (!response.ok) {
          const msg = data?.error?.message || `HTTP ${response.status}`;
          throw new Error(msg);
        }

        const story = extractText(data);
        outputEl.textContent = story || JSON.stringify(data, null, 2);
        statusEl.textContent = " Done.";
      } catch (err) {
        outputEl.textContent = "Error: " + (err.message || String(err));
        statusEl.textContent = " Failed.";
      } finally {
        submitBtn.disabled = false;
      }
    });

    apiKeyInput.addEventListener("input", renderRequestCode);
    wordInput.addEventListener("input", renderRequestCode);
    systemInput.addEventListener("input", renderRequestCode);

    renderRequestCode();
  </script>
</body>
</html>
